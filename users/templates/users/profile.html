{% extends 'base.html' %}
{% block title %}Your profile{% endblock %}
{% block body %}
<div class="mx-auto grid max-w-3xl gap-6 md:grid-cols-3">
  <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm md:col-span-2">
    <h1 class="text-2xl font-bold">Your profile</h1>
    <form method="post" class="qb-form mt-6 space-y-4" novalidate>
      {% csrf_token %}
      {% include 'partials/form_fields.html' with form=user_form %}
      <button type="submit" class="w-full rounded-lg bg-indigo-600 py-2.5 font-semibold text-white hover:bg-indigo-700">Save changes</button>
    </form>
  </div>
  <nav class="h-fit space-y-2 rounded-2xl border border-slate-200 bg-white p-6 text-sm font-medium">
    <a href="{% url 'my-orders' %}" class="block rounded-lg px-3 py-2 hover:bg-slate-50">My orders</a>
    <a href="{% url 'add_address' %}" class="block rounded-lg px-3 py-2 hover:bg-slate-50">Shipping address</a>
    <a href="{% url 'password_reset' %}" class="block rounded-lg px-3 py-2 hover:bg-slate-50">Reset password</a>
    <a href="{% url 'logout' %}" class="block rounded-lg px-3 py-2 text-red-600 hover:bg-red-50">Log out</a>
  </nav>
</div>
{% endblock %}
