{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="text-2xl font-bold">Log in</h1>
  <p class="mt-1 text-sm text-slate-500">New to QuickBasket? <a href="{% url 'register' %}" class="font-medium text-indigo-600 hover:underline">Create an account</a></p>
  <form method="post" class="qb-form mt-6 space-y-4" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}" />
    {% include 'partials/form_fields.html' with form=form %}
    <button type="submit" class="w-full rounded-lg bg-indigo-600 py-2.5 font-semibold text-white hover:bg-indigo-700">Log in</button>
  </form>
  <div class="mt-4 flex justify-between text-sm">
    <a href="{% url 'password_reset' %}" class="text-indigo-600 hover:underline">Forgot password?</a>
    <span class="text-slate-500">Check your inbox to verify a new account.</span>
  </div>
</div>
{% endblock %}
