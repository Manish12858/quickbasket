{% extends 'base.html' %}
{% block title %}Shipping address{% endblock %}
{% block body %}
<div class="mx-auto max-w-xl rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="text-2xl font-bold">{% if editing %}Edit{% else %}Add{% endif %} shipping address</h1>
  <p class="mt-1 text-sm text-slate-500">Your order will be delivered to this address.</p>
  <form method="post" class="qb-form mt-6 space-y-4" novalidate>
    {% csrf_token %}
    {% include 'partials/form_fields.html' with form=form %}
    <button type="submit" class="w-full rounded-lg bg-indigo-600 py-2.5 font-semibold text-white hover:bg-indigo-700">Save address</button>
  </form>
</div>
{% endblock %}
